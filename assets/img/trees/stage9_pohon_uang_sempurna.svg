<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="mega-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="foliageS9" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="coinGrad9" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
    <linearGradient id="trunkGrad9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#2d1202"/>
    </linearGradient>
  </defs>
  <!-- Radiant Aura behind tree -->
  <circle cx="150" cy="110" r="105" fill="#facc15" opacity="0.18" filter="url(#mega-glow)"/>
  
  <!-- Soil Mound with Coins at base -->
  <ellipse cx="150" cy="278" rx="88" ry="18" fill="#142117" opacity="0.8"/>
  <ellipse cx="150" cy="272" rx="72" ry="13" fill="#243329"/>
  <!-- Gold Coins scattered at the roots -->
  <circle cx="115" cy="272" r="8" fill="url(#coinGrad9)"/>
  <circle cx="132" cy="275" r="9" fill="url(#coinGrad9)"/>
  <circle cx="168" cy="275" r="9" fill="url(#coinGrad9)"/>
  <circle cx="185" cy="272" r="8" fill="url(#coinGrad9)"/>

  <!-- Ancient Golden Trunk -->
  <path d="M 124 272 Q 138 180 118 120 Q 148 165 152 108 Q 158 165 182 120 Q 166 180 176 272 Z" fill="url(#trunkGrad9)"/>

  <!-- Full Majestic Golden Foliage -->
  <circle cx="55" cy="115" r="38" fill="url(#foliageS9)" filter="url(#mega-glow)"/>
  <circle cx="95" cy="95" r="44" fill="url(#foliageS9)"/>
  <circle cx="245" cy="115" r="38" fill="url(#foliageS9)" filter="url(#mega-glow)"/>
  <circle cx="205" cy="95" r="44" fill="url(#foliageS9)"/>
  <circle cx="150" cy="65" r="62" fill="url(#foliageS9)" filter="url(#mega-glow)"/>
  <circle cx="120" cy="42" r="35" fill="#fef9c3" opacity="0.7"/>
  <circle cx="180" cy="42" r="35" fill="#fef9c3" opacity="0.7"/>

  <!-- Hanging Wealth Coins -->
  <g filter="url(#mega-glow)">
    <circle cx="62" cy="122" r="12" fill="url(#coinGrad9)" stroke="#78350f" stroke-width="1.5"/>
    <text x="62" y="126" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">$</text>

    <circle cx="102" cy="112" r="13" fill="url(#coinGrad9)" stroke="#78350f" stroke-width="1.5"/>
    <text x="102" y="117" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">$</text>

    <circle cx="140" cy="85" r="14" fill="url(#coinGrad9)" stroke="#78350f" stroke-width="1.5"/>
    <text x="140" y="90" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">$</text>

    <circle cx="165" cy="82" r="14" fill="url(#coinGrad9)" stroke="#78350f" stroke-width="1.5"/>
    <text x="165" y="87" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">$</text>

    <circle cx="198" cy="110" r="13" fill="url(#coinGrad9)" stroke="#78350f" stroke-width="1.5"/>
    <text x="198" y="115" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">$</text>

    <circle cx="236" cy="125" r="12" fill="url(#coinGrad9)" stroke="#78350f" stroke-width="1.5"/>
    <text x="236" y="129" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle" font-family="sans-serif">$</text>
  </g>

  <!-- Crown of Success atop tree -->
  <path d="M 132 18 L 138 28 L 150 20 L 162 28 L 168 18 L 166 33 L 134 33 Z" fill="#fde047" stroke="#78350f" stroke-width="1.5" filter="url(#mega-glow)"/>
  <circle cx="150" cy="16" r="3.5" fill="#38bdf8"/>
</svg>
