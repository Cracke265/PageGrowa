  <circle cx="100" cy="135" r="50" fill="url(#sakuraGrad)"/>
  <circle cx="200" cy="135" r="50" fill="url(#sakuraGrad)"/>
  <circle cx="150" cy="95" r="55" fill="url(#sakuraGrad)"/>
  <circle cx="85" cy="145" r="38" fill="url(#sakuraLight)" filter="url(#sakura-glow)"/>
  <circle cx="215" cy="145" r="38" fill="url(#sakuraLight)" filter="url(#sakura-glow)"/>
  <circle cx="120" cy="115" r="46" fill="url(#sakuraLight)" filter="url(#sakura-glow)"/>
  <circle cx="180" cy="115" r="46" fill="url(#sakuraLight)" filter="url(#sakura-glow)"/>
  <circle cx="150" cy="80" r="42" fill="url(#sakuraLight)" filter="url(#sakura-glow)"/>
  <!-- Falling Petals -->
  <circle cx="95" cy="210" r="4" fill="#FF80AB"/>
  <circle cx="210" cy="225" r="5" fill="#FF80AB"/>
  <circle cx="170" cy="245" r="4" fill="#FF80AB"/>
</svg>
