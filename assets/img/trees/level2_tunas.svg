<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="glow-tunas" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="leafGrad2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#72EE8F"/>
      <stop offset="100%" stop-color="#2DA94F"/>
    </radialGradient>
    <linearGradient id="trunkGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#99633A"/>
      <stop offset="100%" stop-color="#6F3F1C"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="275" rx="55" ry="14" fill="#243329" opacity="0.6"/>
  <!-- Curved Shoot Trunk -->
  <path d="M 143 270 Q 148 200 138 150 Q 130 110 148 85 Q 155 110 152 160 Q 156 210 157 270 Z" fill="url(#trunkGrad2)"/>
  
  <!-- Side Branch -->
  <path d="M 142 165 C 115 150 100 130 95 115 C 105 125 125 140 143 148 Z" fill="url(#trunkGrad2)"/>
  <path d="M 152 140 C 180 125 195 105 200 90 C 190 100 170 118 149 125 Z" fill="url(#trunkGrad2)"/>
  
  <!-- Foliage / Leaves -->
  <path d="M 95 115 C 70 105 75 80 100 85 C 120 90 115 115 95 115 Z" fill="url(#leafGrad2)" filter="url(#glow-tunas)"/>
  <path d="M 200 90 C 225 80 220 55 195 60 C 175 65 180 90 200 90 Z" fill="url(#leafGrad2)" filter="url(#glow-tunas)"/>
  <path d="M 148 85 C 130 60 138 35 152 40 C 166 45 162 70 148 85 Z" fill="url(#leafGrad2)" filter="url(#glow-tunas)"/>
</svg>
