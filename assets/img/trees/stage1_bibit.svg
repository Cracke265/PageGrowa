<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Filter for realistic leaf glow and soft depth -->
    <filter id="softGlowBibit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Filter for ground drop shadow -->
    <filter id="soilShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <!-- Rich realistic leaf gradients -->
    <linearGradient id="leafGradLeftReal" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#145318" />
      <stop offset="25%" stop-color="#1c7c22" />
      <stop offset="65%" stop-color="#3cc42c" />
      <stop offset="92%" stop-color="#7eec43" />
      <stop offset="100%" stop-color="#b8fa67" />
    </linearGradient>

    <linearGradient id="leafGradRightReal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f4513" />
      <stop offset="25%" stop-color="#186b1e" />
      <stop offset="65%" stop-color="#2eb321" />
      <stop offset="92%" stop-color="#72e439" />
      <stop offset="100%" stop-color="#aef75a" />
    </linearGradient>

    <!-- Center tender emerging leaf -->
    <linearGradient id="centerShootGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2a8b1c" />
      <stop offset="60%" stop-color="#56db2d" />
      <stop offset="100%" stop-color="#c1ff6b" />
    </linearGradient>

    <!-- Stem gradient from earthy root base to fresh green apex -->
    <linearGradient id="realStemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d2613" />
      <stop offset="20%" stop-color="#4d4218" />
      <stop offset="45%" stop-color="#366e1b" />
      <stop offset="85%" stop-color="#55b827" />
      <stop offset="100%" stop-color="#7ee439" />
    </linearGradient>

    <!-- Soil mound radial gradient -->
    <radialGradient id="soilMoundGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#694022" />
      <stop offset="40%" stop-color="#482813" />
      <stop offset="75%" stop-color="#2d1709" />
      <stop offset="100%" stop-color="#1b0c04" />
    </radialGradient>

    <!-- Dewdrop gradient -->
    <radialGradient id="dewDropGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e0f7fa" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- ==================== 1. SOIL EMERGENCE & GROUND BASE ==================== -->
  <!-- Ambient soft contact shadow on soil bed -->
  <ellipse cx="160" cy="272" rx="68" ry="18" fill="#140a04" opacity="0.6" filter="url(#soilShadow)" />
  <ellipse cx="160" cy="268" rx="52" ry="13" fill="#1d0e06" opacity="0.75" />

  <!-- Natural organic freshly-turned earth mound (tanah gembur) -->
  <path d="M 104 270 C 112 258 135 252 160 252 C 185 252 208 258 216 270 C 205 277 182 281 160 281 C 138 281 115 277 104 270 Z" fill="url(#soilMoundGrad)" />
  
  <!-- Soil texture clods, crumbs & pebbles breaking open where sprout pushes through -->
  <ellipse cx="140" cy="268" rx="9" ry="4" fill="#3a1e0b" opacity="0.9" />
  <ellipse cx="178" cy="267" rx="8" ry="3.5" fill="#3a1e0b" opacity="0.9" />
  <circle cx="125" cy="271" r="3" fill="#522e15" />
  <circle cx="132" cy="274" r="2.2" fill="#2d1709" />
  <circle cx="150" cy="269" r="3.2" fill="#5c3418" />
  <circle cx="169" cy="270" r="3" fill="#42240f" />
  <circle cx="188" cy="272" r="2.5" fill="#542e14" />
  <circle cx="197" cy="269" r="3.5" fill="#341b0b" />
  <circle cx="160" cy="273" r="2" fill="#6d3d1a" />

  <!-- Soil eruption crater lips right at the stem base -->
  <ellipse cx="160" cy="262" rx="14" ry="4.5" fill="#231106" />
  <path d="M 152 262 Q 155 258 158 261" stroke="#5a3318" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 163 261 Q 166 257 169 262" stroke="#5a3318" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- ==================== 2. REALISTIC BOTANICAL STEM ==================== -->
  <!-- Stem rising from within the soil crater -->
  <path d="M 155 263 C 155 225 156 185 158 145 C 160 145 162 145 163 145 C 165 185 166 225 166 263 C 162 265 158 265 155 263 Z" fill="url(#realStemGrad)" />

  <!-- Cylindrical highlight on stem for 3D realism -->
  <path d="M 158 255 C 158.5 220 159 180 160 150" stroke="#8cf04e" stroke-width="2" stroke-linecap="round" opacity="0.65" fill="none" />
  <!-- Stem shadow edge -->
  <path d="M 164 258 C 164 225 163.5 185 162 150" stroke="#1d4d12" stroke-width="1.5" stroke-linecap="round" opacity="0.7" fill="none" />

  <!-- ==================== 3. LUSH LEFT MAIN LEAF ==================== -->
  <!-- Leaf shadow under leaf -->
  <path d="M 158 165 C 122 170 82 145 80 108 C 104 102 142 125 158 155 Z" fill="#0c300f" opacity="0.35" />

  <!-- Main Left Leaf Blade -->
  <path d="M 159 160 C 118 165 74 138 72 98 C 100 92 144 116 159 150 Z" fill="url(#leafGradLeftReal)" filter="url(#softGlowBibit)" />

  <!-- Left Leaf Top Specular Highlight Edge -->
  <path d="M 72 98 C 98 88 138 108 159 148" stroke="#d4ff8a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65" />

  <!-- Left Leaf Central Midrib Vein -->
  <path d="M 158 154 C 132 138 105 119 75 100" stroke="#bbf76a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Left Leaf Secondary Lateral Veins -->
  <path d="M 144 144 C 136 135 128 132 118 132" stroke="#a3f24b" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 130 134 C 122 124 112 120 102 120" stroke="#a3f24b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 116 125 C 108 116 98 112 88 111" stroke="#a3f24b" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.65" />
  <path d="M 140 148 C 134 154 125 156 114 154" stroke="#a3f24b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 124 139 C 117 144 108 145 98 142" stroke="#a3f24b" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.55" />

  <!-- ==================== 4. LUSH RIGHT MAIN LEAF ==================== -->
  <!-- Main Right Leaf Blade -->
  <path d="M 160 156 C 202 158 246 130 248 90 C 220 86 176 112 161 146 Z" fill="url(#leafGradRightReal)" filter="url(#softGlowBibit)" />

  <!-- Right Leaf Top Specular Highlight Edge -->
  <path d="M 248 90 C 222 82 180 104 161 144" stroke="#dcfb94" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65" />

  <!-- Right Leaf Central Midrib Vein -->
  <path d="M 161 150 C 188 134 216 113 245 92" stroke="#cbfb7b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Right Leaf Secondary Lateral Veins -->
  <path d="M 176 141 C 185 131 195 128 206 128" stroke="#b0f657" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.75" />
  <path d="M 191 131 C 200 120 210 116 221 116" stroke="#b0f657" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 206 121 C 215 111 224 107 234 106" stroke="#b0f657" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.65" />
  <path d="M 181 145 C 188 151 198 153 209 150" stroke="#b0f657" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 197 135 C 205 140 215 141 225 138" stroke="#b0f657" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.55" />

  <!-- ==================== 5. YOUNG UNFOLDING CENTER BUD ==================== -->
  <!-- Tiny center sprout pushing upwards -->
  <path d="M 158 146 C 155 125 157 105 160 98 C 163 105 165 125 162 146 Z" fill="url(#centerShootGrad)" />
  <path d="M 160 145 L 160 102" stroke="#eaffaa" stroke-width="1.5" stroke-linecap="round" />

  <!-- Left micro-leaf bud -->
  <path d="M 158 138 C 150 132 146 120 148 114 C 154 116 158 126 158 138 Z" fill="#88f244" opacity="0.9" />
  <!-- Right micro-leaf bud -->
  <path d="M 162 138 C 170 132 174 120 172 114 C 166 116 162 126 162 138 Z" fill="#88f244" opacity="0.9" />

  <!-- ==================== 6. CRYSTAL DEW DROPS ==================== -->
  <!-- Dewdrop on left leaf -->
  <ellipse cx="106" cy="116" rx="4.5" ry="3.5" fill="url(#dewDropGrad)" />
  <circle cx="104.5" cy="115" r="1.3" fill="#ffffff" />
  <!-- Secondary dewdrop on right leaf tip -->
  <ellipse cx="236" cy="98" rx="3.5" ry="3" fill="url(#dewDropGrad)" />
  <circle cx="235" cy="97" r="1" fill="#ffffff" />

</svg>
