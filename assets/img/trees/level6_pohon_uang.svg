<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="gold-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="canopyGrad6" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#73E88F"/>
      <stop offset="60%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#186D32"/>
    </radialGradient>
    <radialGradient id="lightLeafGrad6" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8BF8A5"/>
      <stop offset="100%" stop-color="#3AC65E"/>
    </radialGradient>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="60%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#D49B1E"/>
    </radialGradient>
    <linearGradient id="trunkGrad6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9E673D"/>
      <stop offset="100%" stop-color="#673917"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="275" rx="80" ry="16" fill="#243329" opacity="0.6"/>
  <!-- Trunk -->
  <path d="M 135 270 Q 140 210 134 180 L 105 145 L 118 138 L 140 165 L 150 140 L 160 165 L 182 138 L 195 145 L 166 180 Q 160 210 165 270 Z" fill="url(#trunkGrad6)"/>
  
  <!-- Back Canopy Layer -->
  <circle cx="100" cy="135" r="50" fill="url(#canopyGrad6)"/>
  <circle cx="200" cy="135" r="50" fill="url(#canopyGrad6)"/>
  <circle cx="150" cy="95" r="55" fill="url(#canopyGrad6)"/>
  
  <!-- Front Lush Canopy Layer -->
  <circle cx="85" cy="145" r="38" fill="url(#lightLeafGrad6)"/>
  <circle cx="215" cy="145" r="38" fill="url(#lightLeafGrad6)"/>
  <circle cx="120" cy="115" r="46" fill="url(#lightLeafGrad6)"/>
  <circle cx="180" cy="115" r="46" fill="url(#lightLeafGrad6)"/>
  <circle cx="150" cy="78" r="42" fill="url(#lightLeafGrad6)"/>
  
  <!-- Glistening Gold Coins (Matches screenshot Pohon Uang) -->
  <!-- Coin 1 Left bottom -->
  <g filter="url(#gold-glow)">
    <circle cx="85" cy="142" r="11" fill="url(#coinGrad)" stroke="#B8860B" stroke-width="1.5"/>
    <text x="85" y="146" font-size="11" font-weight="900" fill="#7A4E00" text-anchor="middle" font-family="sans-serif">$</text>
  </g>
  <!-- Coin 2 Center upper -->
  <g filter="url(#gold-glow)">
    <circle cx="150" cy="85" r="12" fill="url(#coinGrad)" stroke="#B8860B" stroke-width="1.5"/>
    <text x="150" y="89" font-size="12" font-weight="900" fill="#7A4E00" text-anchor="middle" font-family="sans-serif">$</text>
  </g>
  <!-- Coin 3 Left top -->
  <g filter="url(#gold-glow)">
    <circle cx="115" cy="105" r="11" fill="url(#coinGrad)" stroke="#B8860B" stroke-width="1.5"/>
    <text x="115" y="109" font-size="11" font-weight="900" fill="#7A4E00" text-anchor="middle" font-family="sans-serif">$</text>
  </g>
  <!-- Coin 4 Right top -->
  <g filter="url(#gold-glow)">
    <circle cx="185" cy="105" r="11" fill="url(#coinGrad)" stroke="#B8860B" stroke-width="1.5"/>
    <text x="185" y="109" font-size="11" font-weight="900" fill="#7A4E00" text-anchor="middle" font-family="sans-serif">$</text>
  </g>
  <!-- Coin 5 Right bottom -->
  <g filter="url(#gold-glow)">
    <circle cx="215" cy="142" r="11" fill="url(#coinGrad)" stroke="#B8860B" stroke-width="1.5"/>
    <text x="215" y="146" font-size="11" font-weight="900" fill="#7A4E00" text-anchor="middle" font-family="sans-serif">$</text>
  </g>
  <!-- Coin 6 Center mid -->
  <g filter="url(#gold-glow)">
    <circle cx="150" cy="130" r="11" fill="url(#coinGrad)" stroke="#B8860B" stroke-width="1.5"/>
    <text x="150" y="134" font-size="11" font-weight="900" fill="#7A4E00" text-anchor="middle" font-family="sans-serif">$</text>
  </g>
</svg>
