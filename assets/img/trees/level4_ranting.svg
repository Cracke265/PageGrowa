<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="glow-ranting" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="leafGrad4" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7EF79B"/>
      <stop offset="100%" stop-color="#249E3F"/>
    </radialGradient>
    <linearGradient id="trunkGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A57043"/>
      <stop offset="100%" stop-color="#73421E"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="275" rx="65" ry="15" fill="#243329" opacity="0.6"/>
  <!-- Strong 3-branched stem (Matches screenshot Ranting) -->
  <path d="M 138 270 L 144 185 L 95 125 L 107 115 L 148 165 L 147 100 L 153 100 L 152 165 L 193 115 L 205 125 L 156 185 L 162 270 Z" fill="url(#trunkGrad4)"/>
  
  <!-- Left Leaf -->
  <ellipse cx="90" cy="115" rx="30" ry="18" transform="rotate(-40 90 115)" fill="url(#leafGrad4)" filter="url(#glow-ranting)"/>
  <!-- Right Leaf -->
  <ellipse cx="210" cy="115" rx="30" ry="18" transform="rotate(40 210 115)" fill="url(#leafGrad4)" filter="url(#glow-ranting)"/>
  <!-- Top Center Leaf -->
  <ellipse cx="150" cy="85" rx="32" ry="20" fill="url(#leafGrad4)" filter="url(#glow-ranting)"/>
</svg>
