<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="glow-s3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="leafGrad3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <linearGradient id="trunkGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Soil & Roots -->
  <ellipse cx="150" cy="270" rx="60" ry="16" fill="#142117" opacity="0.8"/>
  <ellipse cx="150" cy="265" rx="46" ry="11" fill="#243329"/>
  <!-- Sturdy Young Trunk -->
  <path d="M 143 265 Q 146 190 145 130 Q 155 190 157 265 Z" fill="url(#trunkGrad3)"/>
  <!-- Branch Left -->
  <path d="M 145 170 Q 120 160 105 145" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Branch Right -->
  <path d="M 153 155 Q 180 145 195 130" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Leaf Clusters -->
  <circle cx="100" cy="140" r="22" fill="url(#leafGrad3)" filter="url(#glow-s3)"/>
  <circle cx="118" cy="130" r="18" fill="url(#leafGrad3)"/>
  <circle cx="200" cy="125" r="24" fill="url(#leafGrad3)" filter="url(#glow-s3)"/>
  <circle cx="182" cy="118" r="19" fill="url(#leafGrad3)"/>
  <!-- Crown Top -->
  <circle cx="150" cy="100" r="30" fill="url(#leafGrad3)" filter="url(#glow-s3)"/>
  <circle cx="138" cy="85" r="20" fill="#86efac" opacity="0.6"/>
</svg>
