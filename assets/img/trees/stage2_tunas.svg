<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="glow-s2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="leafGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </radialGradient>
    <linearGradient id="stemGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Soil Base -->
  <ellipse cx="150" cy="265" rx="55" ry="15" fill="#142117" opacity="0.8"/>
  <ellipse cx="150" cy="260" rx="42" ry="10" fill="#243329"/>
  <!-- Stem -->
  <path d="M 147 260 C 147 210 148 160 150 135 C 152 160 153 210 153 260 Z" fill="url(#stemGrad2)"/>
  <!-- Lower Leaves -->
  <path d="M 148 190 C 115 180 100 150 120 135 C 138 125 150 165 148 190 Z" fill="url(#leafGrad2)" filter="url(#glow-s2)"/>
  <path d="M 152 175 C 185 165 200 135 180 120 C 162 110 150 150 152 175 Z" fill="url(#leafGrad2)" filter="url(#glow-s2)"/>
  <!-- Top Fresh Leaf -->
  <path d="M 150 135 C 135 110 140 85 150 80 C 160 85 165 110 150 135 Z" fill="url(#leafGrad2)" filter="url(#glow-s2)"/>
  <!-- Dew Drop on leaf tip -->
  <circle cx="150" cy="78" r="3.5" fill="#38bdf8" opacity="0.9"/>
</svg>
