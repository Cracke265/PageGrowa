<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <filter id="glow-pucuk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="leafGrad3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#76F394"/>
      <stop offset="100%" stop-color="#28A745"/>
    </radialGradient>
    <linearGradient id="trunkGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A26B40"/>
      <stop offset="100%" stop-color="#6F3F1C"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="275" rx="60" ry="14" fill="#243329" opacity="0.6"/>
  <!-- Branching Trunk (Matches screenshot Level 3 Pucuk) -->
  <path d="M 140 270 L 144 190 L 115 140 L 125 135 L 148 175 L 152 175 L 175 135 L 185 140 L 156 190 L 160 270 Z" fill="url(#trunkGrad3)"/>
  
  <!-- Left Sprout Cluster -->
  <ellipse cx="110" cy="130" rx="26" ry="16" transform="rotate(-30 110 130)" fill="url(#leafGrad3)" filter="url(#glow-pucuk)"/>
  <!-- Right Sprout Cluster -->
  <ellipse cx="190" cy="130" rx="26" ry="16" transform="rotate(30 190 130)" fill="url(#leafGrad3)" filter="url(#glow-pucuk)"/>
  <!-- Center Sprout -->
  <path d="M 150 175 L 150 120" stroke="url(#trunkGrad3)" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="150" cy="105" rx="28" ry="18" fill="url(#leafGrad3)" filter="url(#glow-pucuk)"/>
</svg>
