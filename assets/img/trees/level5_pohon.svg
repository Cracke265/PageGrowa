      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="canopyGrad5" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#70E58C"/>
      <stop offset="60%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#1B7536"/>
    </radialGradient>
    <radialGradient id="lightLeafGrad" cx="30%" cy="30%" r="70%">
