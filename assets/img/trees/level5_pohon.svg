  <circle cx="150" cy="95" r="54" fill="url(#canopyGrad5)"/>
  
  <!-- Front Lush Canopy Layer (Matches screenshot Level 5 Pohon) -->
  <circle cx="85" cy="145" r="38" fill="url(#lightLeafGrad)" filter="url(#glow-pohon)"/>
  <circle cx="215" cy="145" r="38" fill="url(#lightLeafGrad)" filter="url(#glow-pohon)"/>
