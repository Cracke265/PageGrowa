  <path d="M 136 270 Q 140 210 135 180 L 110 150 L 122 142 L 142 168 L 150 145 L 158 168 L 178 142 L 190 150 L 165 180 Q 160 210 164 270 Z" fill="url(#trunkGrad5)"/>
  
