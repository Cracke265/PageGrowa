    <linearGradient id="trunkGrad5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9C6439"/>
      <stop offset="100%" stop-color="#693B18"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="275" rx="75" ry="16" fill="#243329" opacity="0.6"/>
