      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#D49B1E"/>
    </linearGradient>
    <radialGradient id="sproutGlow" cx="40%" cy="40%" r="60%">
